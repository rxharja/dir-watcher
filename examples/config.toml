version = 1

[defaults]
on_conflict = "rename" # rename | skip | overwrite
dry_run = false

[watch]
path="~/Downloads"
ignore = ["*.part", "*.crdownload", ".*"]
settle_seconds = 2

[[dest]]
path="~/notes"
extensions=[".txt", ".md"]

[[dest]]
path="~/archives"
extensions=[".tar", ".tar.gz", ".zip"]


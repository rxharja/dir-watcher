version = 1

[defaults]
on_conflict = "rename" # rename | skip | overwrite
dest_path = "~/projects/dir-watcher/output"
dry_run = false

[[watch]]
path="~/Downloads"
ignore = ["*.part", "*.crdownload", ".*"]
settle_seconds = 2

[[dest]]
path="~/notes"
extensions=[".txt", ".md"]

[[dest]]
path="~/archives"
extensions=[".tar", ".tar.gz", ".zip"]


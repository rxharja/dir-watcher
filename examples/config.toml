version = 1

dry_run = false

# global exclude across all watched directories 
# exclude = ["*.pdf"]

# delete :Zone.Identifier files on WSL
[[rule]]
action = "delete"
match = ["*:Zone.Identifier"]

# move scattered notes from all watched dirs into ~/notes
# [[rule]]
# action = "move"
# destination = "~/notes"
# match = ["*.md", "*.txt"]

# [[watch]]
# path = "~/"
# settle_seconds = 5
# # local exclude to the watched directory
# exclude = ["*.env"]

[[watch]]
path = "~/Downloads"

  [[watch.rule]]
  action = "move"
  destination = "~/Documents"
  match = ["*.pdf", "*.docx", "*.odt"]
  # local exclude to the watched rule
  # exclude = ["invoice-*.pdf"]

  [[watch.rule]]
  action = "move"
  destination = "~/archives"
  match = ["*.zip", "*.tar.gz"]

version = 1

dry_run = false

[[rule]]
action = "move"
destination = "~/notes"
match = ["*.md", "*.txt"]

[[rule]]
action = "delete"
match = ["*:Zone.Identifier"]

[[watch]]
path = "~/"
settle_seconds = 2

[[watch]]
path = "~/Downloads"
settle_seconds = 2

  [[watch.rule]]
  action = "move"
  destination = "~/Documents"
  match = ["*.pdf", "*.docx", "*.odt"]

  [[watch.rule]]
  action = "move"
  destination = "~/archives"
  match = ["*.zip", "*.tar.gz"]

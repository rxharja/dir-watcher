version = 1

dry_run = false

exclude = ["*.pdf"]

[[rule]]
action = "move"
destination = "~/notes"
match = ["*.md", "*.txt"]

[[rule]]
action = "delete"
match = ["*:Zone.Identifier"]

[[watch]]
path = "~/"
settle_seconds = 2
exclude = ["*.env"]

[[watch]]
path = "~/Downloads"
settle_seconds = 2

  [[watch.rule]]
  action = "move"
  destination = "~/Documents"
  match = ["*.pdf", "*.docx", "*.odt"]
  exclude = ["invoce-*.pdf"]

  [[watch.rule]]
  action = "move"
  destination = "~/archives"
  match = ["*.zip", "*.tar.gz"]
